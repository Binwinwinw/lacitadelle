<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Administration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <h2>La Citadelle</h2>
            <a href="/" class="sidebar-link">Retour au chat</a>
            <a href="/settings" class="sidebar-link">Réglages</a>
            <a href="/admin" class="sidebar-link" aria-current="page">Administration</a>
            <form method="POST" action="/logout">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </aside>
        <main class="chat-main settings-main">
            <h1>Administration</h1>
            <section class="settings-section" aria-labelledby="summary-heading">
                <h2 id="summary-heading">Résumé</h2>
                <p>Utilisateurs : <span id="user-count">—</span></p>
                <p>Admins actifs (maximum 1 jusqu'à V3.2) :
                    <span id="active-admin-count">—</span></p>
                <p>Utilisateurs désactivés : <span id="disabled-user-count">—</span></p>
            </section>
            <section class="settings-section"
                     aria-labelledby="create-user-heading">
                <h2 id="create-user-heading">Créer un utilisateur</h2>
                <form id="create-user-form" class="settings-form">
                    <label for="new-username">Nom d'utilisateur</label>
                    <input type="text" id="new-username" name="username"
                           required minlength="3" maxlength="30"
                           pattern="[a-zA-Z0-9_]+">
                    <button type="submit" class="settings-save">Créer</button>
                </form>
                <div id="create-user-result" class="settings-status"
                     role="status" aria-live="polite"></div>
            </section>
            <section class="settings-section" aria-labelledby="users-heading">
                <h2 id="users-heading">Utilisateurs</h2>
                <p id="admin-status" class="settings-status" role="status"
                   aria-live="polite">Chargement...</p>
                <div class="admin-table-wrap">
                    <table class="admin-users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom d'utilisateur</th>
                                <th>Rôle</th>
                                <th>Actif</th>
                                <th>Créé le</th>
                                <th>Dernière connexion</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script>
        const adminStatus = document.getElementById("admin-status");
        const usersBody = document.getElementById("admin-users");
        const createUserForm = document.getElementById("create-user-form");
        const createUserResult = document.getElementById("create-user-result");
        let currentUsername = null;

        function addCell(row, value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        }

        async function changeUserStatus(user) {
            const action = user.is_active === 1 ? "deactivate" : "activate";
            const label = action === "deactivate" ? "Désactiver" : "Réactiver";
            const confirmation = action === "deactivate"
                ? `${label} ${user.username} ? Ses conversations seront supprimées et ses sessions de connexion révoquées.`
                : `${label} ${user.username} ?`;
            if (!window.confirm(confirmation)) {
                return;
            }

            adminStatus.textContent = "";
            try {
                const response = await fetch(
                    `/api/admin/users/${user.id}/${action}`,
                    {
                        method: "POST",
                        credentials: "same-origin",
                    },
                );
                const result = await response.json();
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    adminStatus.textContent =
                        result.error || `Erreur : ${label.toLowerCase()}.`;
                    return;
                }
                await loadUsers();
                adminStatus.textContent = result.message;
            } catch (error) {
                adminStatus.textContent =
                    `Erreur réseau : ${error.message}`;
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch("/api/admin/users", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (response.status === 403) {
                    adminStatus.textContent = "Accès réservé à l'administration.";
                    return;
                }
                if (!response.ok) {
                    adminStatus.textContent = "Erreur de chargement des utilisateurs.";
                    return;
                }

                const data = await response.json();
                const summary = data.summary;
                document.getElementById("user-count").textContent =
                    String(summary.user_count);
                document.getElementById("active-admin-count").textContent =
                    String(summary.active_admins);
                document.getElementById("disabled-user-count").textContent =
                    String(summary.disabled_users);
                usersBody.replaceChildren();
                for (const user of data.users) {
                    const row = document.createElement("tr");
                    addCell(row, String(user.id));
                    addCell(row, user.username);
                    addCell(row, user.role);
                    addCell(row, user.is_active === 1 ? "Oui" : "Non");
                    addCell(row, user.created_at);
                    addCell(row, user.last_login_at || "Jamais");
                    const actionsCell = document.createElement("td");
                    const actionButton = document.createElement("button");
                    actionButton.type = "button";
                    actionButton.textContent =
                        user.is_active === 1 ? "Désactiver" : "Réactiver";
                    actionButton.addEventListener("click", () => {
                        changeUserStatus(user);
                    });
                    actionsCell.appendChild(actionButton);
                    if (user.role === "user" && user.is_active === 1) {
                        const promoteButton = document.createElement("button");
                        promoteButton.type = "button";
                        promoteButton.textContent = "Promouvoir";
                        promoteButton.addEventListener("click", () => {
                            changeUserRole(user, "promote");
                        });
                        actionsCell.appendChild(promoteButton);
                    } else if (
                        user.role === "admin"
                        && user.username !== currentUsername
                    ) {
                        const demoteButton = document.createElement("button");
                        demoteButton.type = "button";
                        demoteButton.textContent = "Rétrograder";
                        demoteButton.addEventListener("click", () => {
                            changeUserRole(user, "demote");
                        });
                        actionsCell.appendChild(demoteButton);
                    }
                    row.appendChild(actionsCell);
                    usersBody.appendChild(row);
                }
                adminStatus.textContent = "";
            } catch (error) {
                adminStatus.textContent =
                    `Erreur réseau : ${error.message}`;
            }
        }

        async function changeUserRole(user, action) {
            const confirmation = action === "promote"
                ? `Promouvoir ${user.username} et transférer le rôle admin ? Votre rôle deviendra user, vos conversations seront supprimées et vous devrez vous reconnecter.`
                : `Rétrograder ${user.username} ? Ses conversations seront supprimées et sa connexion révoquée.`;
            if (!window.confirm(confirmation)) {
                return;
            }

            adminStatus.textContent = "";
            try {
                const response = await fetch(
                    `/api/admin/users/${user.id}/${action}`,
                    {
                        method: "POST",
                        credentials: "same-origin",
                    },
                );
                const result = await response.json();
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    adminStatus.textContent =
                        result.error || `Erreur : ${action}.`;
                    return;
                }
                if (action === "promote") {
                    window.location.href = "/login";
                    return;
                }
                await loadUsers();
                adminStatus.textContent = result.message;
            } catch (error) {
                adminStatus.textContent =
                    `Erreur réseau : ${error.message}`;
            }
        }

        async function loadCurrentAdmin() {
            try {
                const response = await fetch("/api/me", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    adminStatus.textContent =
                        "Erreur de vérification du compte admin.";
                    return;
                }
                const user = await response.json();
                currentUsername = user.username;
                await loadUsers();
            } catch (error) {
                adminStatus.textContent =
                    `Erreur réseau : ${error.message}`;
            }
        }

        createUserForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            createUserResult.replaceChildren();
            const username = document.getElementById("new-username").value.trim();
            try {
                const response = await fetch("/api/admin/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username }),
                    credentials: "same-origin",
                });
                const data = await response.json();
                if (response.status === 201) {
                    const created = document.createElement("p");
                    created.textContent = `Utilisateur ${data.username} créé.`;
                    const passwordLabel = document.createElement("p");
                    passwordLabel.textContent =
                        "Mot de passe temporaire (à communiquer par un canal sûr, il ne sera plus affiché) :";
                    const password = document.createElement("code");
                    password.className = "temp-password";
                    password.textContent = data.temp_password;
                    const copyButton = document.createElement("button");
                    copyButton.type = "button";
                    copyButton.textContent = "Copier";
                    copyButton.addEventListener("click", async () => {
                        try {
                            await navigator.clipboard.writeText(data.temp_password);
                            copyButton.textContent = "Copié !";
                        } catch (error) {
                            copyButton.textContent = "Copie impossible";
                        }
                    });
                    const warning = document.createElement("p");
                    warning.className = "warning";
                    warning.textContent =
                        "L'utilisateur devra changer son mot de passe à la première connexion.";
                    createUserResult.append(
                        created,
                        passwordLabel,
                        password,
                        document.createTextNode(" "),
                        copyButton,
                        warning,
                    );
                    document.getElementById("new-username").value = "";
                    loadCurrentAdmin();
                } else if (response.status === 401) {
                    window.location.href = "/login";
                } else if (response.status === 403) {
                    createUserResult.textContent = "Accès refusé.";
                } else {
                    createUserResult.textContent =
                        data.error || "Erreur lors de la création.";
                }
            } catch (error) {
                createUserResult.textContent =
                    `Erreur réseau ou réponse invalide : ${error.message}`;
            }
        });

        loadUsers();
    </script>
</body>
</html>
