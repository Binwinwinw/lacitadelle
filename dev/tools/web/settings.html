<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Réglages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <h2>La Citadelle</h2>
            <a href="/" class="sidebar-link">Retour au chat</a>
            <a href="/admin" id="admin-link" class="sidebar-link" hidden>
                Administration
            </a>
            <form method="POST" action="/logout">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </aside>
        <main class="chat-main settings-main">
            <h1>Réglages</h1>
            <section class="settings-section" aria-labelledby="account-heading">
                <h2 id="account-heading">Mon compte</h2>
                <p>Nom d'utilisateur : <span id="settings-username">Chargement...</span></p>
                <a href="/change-password" class="sidebar-link">Changer le mot de passe</a>
            </section>
            <section class="settings-section" aria-labelledby="preferences-heading">
                <h2 id="preferences-heading">Préférences</h2>
                <form id="preferences-form" class="settings-form">
                    <label for="theme">Thème</label>
                    <select id="theme" name="theme" required>
                        <option value="light">Clair</option>
                        <option value="dark">Sombre</option>
                    </select>
                    <label for="font-size">Taille du texte</label>
                    <select id="font-size" name="font_size" required>
                        <option value="small">Petite</option>
                        <option value="normal">Normale</option>
                        <option value="large">Grande</option>
                    </select>
                    <button type="submit" class="settings-save">Enregistrer</button>
                </form>
                <p id="settings-status" class="settings-status" role="status"
                   aria-live="polite"></p>
            </section>
            <section id="user-indicators-section" class="settings-section"
                     aria-labelledby="user-indicators-heading" hidden>
                <div class="indicator-heading">
                    <h2 id="user-indicators-heading">Mes indicateurs</h2>
                    <label for="user-indicator-window">Période</label>
                    <select id="user-indicator-window" class="indicator-window">
                        <option value="24h">24 heures</option>
                        <option value="7d">7 jours</option>
                        <option value="30d">30 jours</option>
                    </select>
                </div>
                <p id="user-indicators-status" class="settings-status"
                   role="status" aria-live="polite"></p>
                <div class="admin-table-wrap">
                    <table class="admin-users-table indicators-table">
                        <thead>
                            <tr>
                                <th>Indicateur</th>
                                <th>Valeur</th>
                            </tr>
                        </thead>
                        <tbody id="user-indicators-tbody"></tbody>
                    </table>
                </div>
            </section>
            <section id="user-logs-section" class="settings-section"
                     aria-labelledby="user-logs-heading" hidden>
                <h2 id="user-logs-heading">Mes logs</h2>
                <p id="user-logs-status" class="settings-status" role="status"
                   aria-live="polite"></p>
                <div class="admin-table-wrap">
                    <table class="admin-users-table logs-table">
                        <thead>
                            <tr>
                                <th>Horodatage</th>
                                <th>Utilisateur</th>
                                <th>Session</th>
                                <th>Durée (ms)</th>
                                <th>Statut</th>
                                <th>Tokens (entrée / sortie)</th>
                            </tr>
                        </thead>
                        <tbody id="user-logs-tbody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script>
        const preferencesForm = document.getElementById("preferences-form");
        const statusMessage = document.getElementById("settings-status");
        const themeSelect = document.getElementById("theme");
        const fontSizeSelect = document.getElementById("font-size");
        const adminLink = document.getElementById("admin-link");
        const userIndicatorsSection = document.getElementById(
            "user-indicators-section",
        );
        const userIndicatorWindow = document.getElementById(
            "user-indicator-window",
        );
        const userIndicatorsTbody = document.getElementById(
            "user-indicators-tbody",
        );
        const userIndicatorsStatus = document.getElementById(
            "user-indicators-status",
        );
        const userLogsSection = document.getElementById("user-logs-section");
        const userLogsTbody = document.getElementById("user-logs-tbody");
        const userLogsStatus = document.getElementById("user-logs-status");
        let logsInterval = null;
        let indicatorsInterval = null;

        function applyPreferences(preferences) {
            document.documentElement.dataset.theme = preferences.theme;
            document.documentElement.dataset.fontSize = preferences.font_size;
        }

        async function loadPreferences() {
            try {
                const response = await fetch("/api/preferences", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    statusMessage.textContent = "Erreur de chargement des réglages.";
                    return;
                }
                const preferences = await response.json();
                document.getElementById("settings-username").textContent =
                    preferences.username;
                themeSelect.value = preferences.theme;
                fontSizeSelect.value = preferences.font_size;
                applyPreferences(preferences);
            } catch (error) {
                statusMessage.textContent = `Erreur réseau : ${error.message}`;
            }
        }

        async function loadAdminLink() {
            try {
                const response = await fetch("/api/me", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    statusMessage.textContent = "Erreur de vérification du rôle.";
                    return;
                }
                const user = await response.json();
                const isAdmin = user.role === "admin";
                adminLink.hidden = !isAdmin;
                userIndicatorsSection.hidden = isAdmin;
                userLogsSection.hidden = isAdmin;
                if (!isAdmin) {
                    startIndicatorsPolling();
                    startLogsPolling();
                }
            } catch (error) {
                statusMessage.textContent = `Erreur réseau : ${error.message}`;
            }
        }

        function renderIndicators(data) {
            const values = [
                ["Total inférences", String(data.total_inferences)],
                [
                    "Tokens/s moyen",
                    data.tokens_per_second_avg === null
                        ? "Indisponible"
                        : `${data.tokens_per_second_avg.toFixed(2)} tokens/s`,
                ],
                ["Latence moyenne", `${data.latency_avg_ms.toFixed(1)} ms`],
                ["Latence p95", `${data.latency_p95_ms} ms`],
                ["Taux d'erreur", `${(data.error_rate * 100).toFixed(1)} %`],
                ["Sessions actives", String(data.active_sessions)],
                [
                    "Temps moyen/requête",
                    `${data.avg_time_per_request_ms.toFixed(1)} ms`,
                ],
            ];
            userIndicatorsTbody.replaceChildren();
            for (const [label, value] of values) {
                const row = document.createElement("tr");
                for (const text of [label, value]) {
                    const cell = document.createElement("td");
                    cell.textContent = text;
                    row.appendChild(cell);
                }
                userIndicatorsTbody.appendChild(row);
            }
        }

        async function loadIndicators() {
            if (document.hidden || userIndicatorsSection.hidden) {
                return;
            }
            try {
                const response = await fetch(
                    `/api/indicators?window=${userIndicatorWindow.value}`,
                    { credentials: "same-origin" },
                );
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    userIndicatorsStatus.textContent =
                        "Erreur de chargement de vos indicateurs.";
                    return;
                }
                const data = await response.json();
                renderIndicators(data);
                userIndicatorsStatus.textContent = "";
            } catch (error) {
                userIndicatorsStatus.textContent =
                    `Erreur de chargement de vos indicateurs : ${error.message}`;
            }
        }

        function startIndicatorsPolling() {
            if (
                indicatorsInterval
                || document.hidden
                || userIndicatorsSection.hidden
            ) {
                return;
            }
            loadIndicators();
            indicatorsInterval = window.setInterval(loadIndicators, 5000);
        }

        function stopIndicatorsPolling() {
            if (indicatorsInterval) {
                window.clearInterval(indicatorsInterval);
                indicatorsInterval = null;
            }
        }

        function renderLogsTable(logs) {
            userLogsTbody.replaceChildren();
            for (const log of logs) {
                const row = document.createElement("tr");
                const values = [
                    log.timestamp,
                    log.username,
                    log.session_title || "—",
                    `${log.duration_ms}`,
                    log.status,
                    `${log.prompt_tokens ?? "—"} / ${log.completion_tokens ?? "—"}`,
                ];
                for (const value of values) {
                    const cell = document.createElement("td");
                    cell.textContent = String(value);
                    row.appendChild(cell);
                }
                userLogsTbody.appendChild(row);
            }
        }

        async function loadLogs() {
            if (document.hidden || userLogsSection.hidden) {
                return;
            }
            try {
                const response = await fetch("/api/logs/tail?lines=50", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    userLogsStatus.textContent =
                        "Erreur de chargement de vos logs.";
                    return;
                }
                const data = await response.json();
                if (!Array.isArray(data.logs)) {
                    throw new Error("Réponse des logs invalide.");
                }
                renderLogsTable(data.logs);
                userLogsStatus.textContent = "";
            } catch (error) {
                userLogsStatus.textContent =
                    `Erreur de chargement de vos logs : ${error.message}`;
            }
        }

        function startLogsPolling() {
            if (logsInterval || document.hidden || userLogsSection.hidden) {
                return;
            }
            loadLogs();
            logsInterval = window.setInterval(loadLogs, 5000);
        }

        function stopLogsPolling() {
            if (logsInterval) {
                window.clearInterval(logsInterval);
                logsInterval = null;
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (
                document.hidden
                || userIndicatorsSection.hidden
            ) {
                stopIndicatorsPolling();
            } else {
                startIndicatorsPolling();
            }
            if (document.hidden || userLogsSection.hidden) {
                stopLogsPolling();
            } else {
                startLogsPolling();
            }
        });
        userIndicatorWindow.addEventListener("change", loadIndicators);

        preferencesForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            statusMessage.textContent = "";
            try {
                const response = await fetch("/settings/preferences", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        theme: themeSelect.value,
                        font_size: fontSizeSelect.value,
                    }),
                    credentials: "same-origin",
                });
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    const result = await response.json();
                    statusMessage.textContent =
                        result.error || "Erreur d'enregistrement des préférences.";
                    return;
                }
                const preferences = await response.json();
                applyPreferences(preferences);
                statusMessage.textContent = "Préférences enregistrées.";
            } catch (error) {
                statusMessage.textContent = `Erreur réseau : ${error.message}`;
            }
        });

        loadPreferences();
        loadAdminLink();
    </script>
</body>
</html>
