<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <h2>La Citadelle</h2>
            <button id="new-session" type="button">+ Nouvelle session</button>
            <a href="/settings" class="sidebar-link">Réglages</a>
            <a href="/admin" id="admin-link" class="sidebar-link" hidden>
                Administration
            </a>
            <ul id="sessions-list"></ul>
            <form method="POST" action="/logout">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </aside>
        <main class="chat-main">
            <div id="messages" class="messages" aria-live="polite">
                <p class="placeholder">Sélectionnez une session ou créez-en une nouvelle.</p>
            </div>
            <form id="chat-form" class="chat-form">
                <textarea
                    id="user-input"
                    placeholder="Votre message..."
                    rows="2"
                    disabled></textarea>
                <button type="submit" id="send-btn" disabled>Envoyer</button>
            </form>
            <div id="status" class="status" role="status" aria-live="polite"></div>
        </main>
    </div>
    <script src="chat.js"></script>
</body>
</html>
