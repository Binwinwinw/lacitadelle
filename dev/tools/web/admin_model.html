<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Changer de modèle</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <h2>La Citadelle</h2>
            <a href="/" class="sidebar-link">Retour au chat</a>
            <a href="/admin" class="sidebar-link">Administration</a>
            <form method="POST" action="/logout">
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </aside>
        <main class="chat-main settings-main">
            <h1>Changer de modèle</h1>
            <section class="settings-section" aria-labelledby="model-heading">
                <h2 id="model-heading">Modèle actuel</h2>
                <p id="model-current" role="status" aria-live="polite">
                    Chargement...
                </p>
                <form id="model-form" class="settings-form"
                      method="POST" action="/admin/model">
                    <label for="model-path">Chemin GGUF (absolu)</label>
                    <input type="text" id="model-path" name="model_path"
                           placeholder="C:\chemin\vers\modele.gguf" required>
                    <button type="submit" class="settings-save">
                        Enregistrer
                    </button>
                </form>
                <p id="model-status" class="settings-status" role="status"
                   aria-live="polite"></p>
                <p>Le chemin sera enregistré, mais le nouveau modèle ne sera
                    pas appliqué au runtime avant le test de chargement et le
                    redémarrage prévus en 11d.</p>
                <a href="/admin" class="sidebar-link">Retour à l'administration</a>
            </section>
        </main>
    </div>
    <script>
        const modelCurrent = document.getElementById("model-current");
        const modelStatus = document.getElementById("model-status");
        const query = new URLSearchParams(window.location.search);

        if (query.get("saved") === "1") {
            modelStatus.textContent =
                "Chemin enregistré. Le runtime ne chargera le nouveau modèle " +
                "qu'après le test et le redémarrage prévus en 11d.";
        } else if (query.has("error")) {
            modelStatus.textContent = query.get("error");
        }

        async function loadCurrentModel() {
            try {
                const response = await fetch("/api/settings/model", {
                    credentials: "same-origin",
                });
                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }
                if (!response.ok) {
                    modelStatus.textContent =
                        "Impossible de charger le modèle configuré.";
                    return;
                }
                const model = await response.json();
                modelCurrent.textContent =
                    model.current_model_path || "Aucun modèle configuré";
            } catch (error) {
                modelStatus.textContent =
                    `Erreur réseau : ${error.message}`;
            }
        }

        loadCurrentModel();
    </script>
</body>
</html>
