<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Changement de mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h1>Changer de mot de passe</h1>
        <p class="subtitle">Votre mot de passe actuel doit être changé.</p>
        <form id="change-form" action="/change-password" method="POST">
            <label for="old_password">Mot de passe actuel</label>
            <input type="password" id="old_password"
                   name="old_password" required>
            <label for="new_password">Nouveau mot de passe (min 8)</label>
            <input type="password" id="new_password"
                   name="new_password" required minlength="8">
            <label for="new_password_confirm">Confirmer</label>
            <input type="password" id="new_password_confirm"
                   name="new_password_confirm" required minlength="8">
            <button type="submit">Changer</button>
        </form>
    </main>
</body>
</html>
