<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{CSRF_TOKEN}}">
    <title>La Citadelle - Changement de mot de passe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h1>Changer de mot de passe</h1>
        <p class="subtitle">Changer votre mot de passe.</p>
        <form id="change-form" action="/change-password" method="POST">
            <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
            <label for="old_password">Mot de passe actuel</label>
            <input type="password" id="old_password"
                   name="old_password" required>
            <label for="new_password">Nouveau mot de passe (min 8)</label>
            <input type="password" id="new_password"
                   name="new_password" required minlength="8">
            <label for="new_password_confirm">Confirmer</label>
            <input type="password" id="new_password_confirm"
                   name="new_password_confirm" required minlength="8">
            <button type="submit">Changer</button>
        </form>
        <div id="change-error" class="error" role="alert" aria-live="polite"
             style="color:#ff6b6b;margin-top:0.5rem;"></div>
    </main>
    <script>
        const csrfToken = document.querySelector(
            'meta[name="csrf-token"]',
        ).content;
        document.getElementById("change-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.target;
            const button = form.querySelector('button[type="submit"]');
            const error = document.getElementById("change-error");
            error.textContent = "";
            button.disabled = true;
            try {
                const response = await fetch("/change-password", {
                    method: "POST",
                    headers: { "X-CSRF-Token": csrfToken },
                    body: new URLSearchParams(new FormData(form)),
                    credentials: "same-origin",
                });
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    error.textContent = data.error || "Erreur lors du changement";
                    return;
                }
                window.location.href = "/";
            } catch (err) {
                error.textContent = "Erreur réseau : " + err.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
