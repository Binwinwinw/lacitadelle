<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Citadelle - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <h1>La Citadelle</h1>
        <p class="subtitle">Assistant IA local</p>
        <form id="login-form" action="/login" method="POST">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Entrez votre nom"
                required
                maxlength="50"
                autofocus>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Connexion</button>
        </form>
        <div id="login-error" class="error" role="alert" aria-live="polite"
             style="color:#ff6b6b;margin-top:0.5rem;"></div>
        <p class="subtitle" style="text-align:center;margin-top:1rem;">
            <a href="/register">Créer un compte</a>
        </p>
    </main>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.target;
            const button = form.querySelector('button[type="submit"]');
            const error = document.getElementById("login-error");
            error.textContent = "";
            button.disabled = true;
            try {
                const response = await fetch("/login", {
                    method: "POST",
                    body: new URLSearchParams(new FormData(form)),
                    credentials: "same-origin",
                });
                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    error.textContent = data.error || "Identifiants invalides";
                    return;
                }
                window.location.href = "/";
            } catch (err) {
                error.textContent = "Erreur réseau : " + err.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
